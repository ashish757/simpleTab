<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="./styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div id="overlay"></div>

        <div class="time">
            <span id="currentTime"></span>
        </div>

    <div class="searchBar" id="searchWrapper">
        <form id="searchForm">
            <input type="text"  id="searchInput" placeholder="Search the web...">
        </form>

        <select id="searchEngine">
            <option value="google">Google</option>
            <option value="duckduckgo">Duck Duck Go</option>
            <option value="bing">Bing</option>
        </select>
    </div>

    <div class="shortcuts" id="shortcutsContainer">
        <div class="shortcut">
            <img src="https://www.google.com/s2/favicons?domain=https://www.github.com&sz=32">
            <span>Github</span>
        </div>
        <div class="shortcut">
            <img src="https://www.google.com/s2/favicons?domain=https://www.github.com&sz=32">
            <span>Github</span>
        </div>
        <div class="shortcut">
            <img src="https://www.google.com/s2/favicons?domain=https://www.github.com&sz=32">
            <span>Github</span>
        </div>

    </div>
    </main>

    <div id="modal">
        <p id="closeModal">&times;</p>
        <h1>shortcuts</h1>

        <div class="addShortcut">
            <input type="text" id="shortcutName" placeholder="Shortcut Name">
            <input type="text" id="shortcutURL" placeholder="Shortcut URL">
            <button id="addShortcutBtn">Add Shortcut</button>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
