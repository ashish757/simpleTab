<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>

    <div class="searchBar">
        <form id="searchForm">
            <input type="text"  id="searchInput" placeholder="Search the web...">
        </form>

        <select id="searchEngine">
            <option option="google">Google</option>
            <option value="duckDuckGo">Duck Duck Go</option>
            <option value="bing">Bing</option>
        </select>
    </div>

    <div class="shortcuts">
        <div class="shortcut">
            <img src="https://www.google.com/s2/favicons?domain=https://www.github.com&sz=32">
            <span>Github</span>
        </div>
        <div class="shortcut">
            <img src="https://www.google.com/s2/favicons?domain=https://www.github.com&sz=32">
            <span>Github</span>
        </div>
        <div class="shortcut">
            <img src="https://www.google.com/s2/favicons?domain=https://www.github.com&sz=32">
            <span>Github</span>
        </div>

    </div>
    </main>


    <script src="script.js"></script>
</body>
</html>
